        const clean = String(actorName || '').trim();
        if (!clean) return '';
        const grp = ACTOR_GROUPS[clean];
        return grp ? clean + '（' + grp + '）' : clean;
      }

      function formatPairCast(actors) {
        if (!Array.isArray(actors)) return '';
        return actors.map(formatActorName).filter(Boolean).join(' × ');

        if (!Array.isArray(actors)) return '';

          if (grp && list.indexOf(grp) === -1) {
            list.push(grp);
          }
        });
        return list.join(' / ');

      // =========================================================================
      // 5. 状態管理（localStorage 安全アクセス付き）
      // =========================================================================
      const STORAGE_KEYS = {
        FAVORITES: 'bl_oshi_app_favorites_v4',
        GROUP_NAME: 'bl_oshi_app_group_name_v4'
      };

      function safeGetStorage(key, fallback) {
        try {
          const raw = window.localStorage.getItem(key);
          return raw === null ? fallback : raw;
        } catch (e) {
          return fallback;
        }
      }

      function safeSetStorage(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch (e) {
          // Storage unavailable
        }
      }

      function loadFavorites() {
        try {
          const parsed = JSON.parse(safeGetStorage(STORAGE_KEYS.FAVORITES, '[]'));
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function saveFavorites(list) {
        safeSetStorage(STORAGE_KEYS.FAVORITES, JSON.stringify(list));
      }

      function loadGroupName() {
        return safeGetStorage(STORAGE_KEYS.GROUP_NAME, '');
      }

      function saveGroupName(name) {
        safeSetStorage(STORAGE_KEYS.GROUP_NAME, String(name || ''));
      }

        const el = document.createElement('div');
        el.className = 'toast-enter px-4 py-2.5 rounded-2xl bg-zinc-900 text-white text-xs sm:text-sm font-semibold shadow-lg';
        el.textContent = message;
        container.appendChild(el);
        setTimeout(function () {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.2s ease';
          setTimeout(function () {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 220);
        }, 2200);
      }

      // =========================================================================
      // 8. 診断計算・共有URL・Xシェア・PNGカード保存
      // =========================================================================
      function computeUserProfile() {
        const profile = {
          youth: 0,
          emotional: 0,
          comedy: 0,
          sweet: 0,
          lateNight: 0,
          indie: 0,
          group: 0
        };

        state.answers.forEach(function (ansIdx, qIdx) {
          if (ansIdx === null || ansIdx === undefined) return;
          const q = QUIZ_QUESTIONS[qIdx];
          if (!q || !q.options[ansIdx]) return;
          const w = q.options[ansIdx].weights || {};
          Object.keys(w).forEach(function (k) {
            if (Object.prototype.hasOwnProperty.call(profile, k)) {
              profile[k] += Number(w[k]) || 0;
            }
          });
        });

        if (state.groupName && state.groupName.trim().length > 0) {
          profile.group += 3;
        }

        return profile;
      }

      function calculateDiagnosis() {
        const profile = computeUserProfile();
        const keys = ['youth', 'emotional', 'comedy', 'sweet', 'lateNight', 'indie', 'group'];

        const scored = BL_DRAMAS.map(function (drama) {
          let score = 0;
          keys.forEach(function (k) {
            const dw = drama.weights && drama.weights[k] ? drama.weights[k] : 0;
            score += dw * (profile[k] || 0);
          });
          if (state.groupName && state.groupName.trim().length > 0) {
            const gLower = state.groupName.trim().toLowerCase();
            const grpLabel = getDramaGroupsLabel(drama.castList);
            if (grpLabel && grpLabel.toLowerCase().indexOf(gLower) !== -1) {
              score += 25;
            }
          }
          return { drama: drama, score: score };
        });

        scored.sort(function (a, b) {
          if (b.score !== a.score) return b.score - a.score;
          return (b.drama.popularScore || 0) - (a.drama.popularScore || 0);
        });

        return scored;
      }

      function buildShareUrl() {
        try {
          const url = new URL(window.location.href);
          url.searchParams.set('q', state.answers.map(function (a) { return a === null ? '-' : a; }).join(','));
          if (state.groupName && state.groupName.trim()) {
            url.searchParams.set('group', state.groupName.trim());
          } else {
            url.searchParams.delete('group');
          }
          return url.toString();
        } catch (e) {
          return window.location.href;
        }
      }

      function copyTextFallback(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          return true;
        } catch (e) {
          return false;
        }
      }

      function copyShareUrl() {
        const shareUrl = buildShareUrl();
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(shareUrl).then(function () {
            showToast('共有URLをコピーしました');
          }).catch(function () {
            copyTextFallback(shareUrl);
            showToast('共有URLをコピーしました');
          });
        } else {
          copyTextFallback(shareUrl);
          showToast('共有URLをコピーしました');
        }
      }

      function shareAppUrl() {
        const appUrl = window.location.href;
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(appUrl).then(function () {
            showToast('アプリURLをコピーしました');
          }).catch(function () {
            copyTextFallback(appUrl);

          });

          copyTextFallback(appUrl);

        const shareUrl = buildShareUrl();
        const groupPrefix = state.groupName && state.groupName.trim()
          ? '【' + state.groupName.trim() + '】'
          : '';
        const pairStr = top ? formatPairCast(top.castList) : '';
        const text = top
          ? '日本BLドラマ推し診断' + groupPrefix + ' 1位『' + top.title + '』（' + pairStr + '）'
          : '日本BLドラマ推し診断';
        const intentUrl = 'https://twitter.com/intent/tweet?text=' +
          encodeURIComponent(text) + '&url=' + encodeURIComponent(shareUrl);
        window.open(intentUrl, '_blank', 'noopener,noreferrer');
      }

      function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
        const chars = String(text || '').split('');
        let line = '';
        let curY = y;
        for (let i = 0; i < chars.length; i++) {
          const testLine = line + chars[i];
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth && line.length > 0) {
            ctx.fillText(line, x, curY);
            line = chars[i];
            curY += lineHeight;
          } else {
            line = testLine;
          }
        }
        if (line) {
          ctx.fillText(line, x, curY);
          curY += lineHeight;
        }
        return curY;
      }

      function downloadResultPng() {
        try {
          const ranked = calculateDiagnosis();
          if (!ranked.length) return;

          const canvas = document.createElement('canvas');
          canvas.width = 1080;
          canvas.height = 1080;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
          grad.addColorStop(0, '#fdf2f8');
          grad.addColorStop(0.5, '#f5f3ff');
          grad.addColorStop(1, '#eff6ff');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 1080, 1080);

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.roundRect(72, 72, 936, 936, 40);
          ctx.fill();

          ctx.fillStyle = '#7e22ce';
          ctx.font = 'bold 28px "Noto Sans JP", sans-serif';
          ctx.fillText('日本BLドラマ推し診断', 124, 152);

          let cursorY = 210;
          if (state.groupName && state.groupName.trim()) {
            ctx.fillStyle = '#db2777';
            ctx.font = 'bold 26px "Noto Sans JP", sans-serif';
            ctx.fillText(state.groupName.trim(), 124, cursorY);
            cursorY += 46;
          }

          const top1 = ranked[0].drama;
          ctx.fillStyle = '#18181b';
          ctx.font = 'bold 46px "Noto Sans JP", sans-serif';
          cursorY = wrapCanvasText(ctx, '1位：' + top1.title, 124, cursorY + 12, 832, 58);

          ctx.fillStyle = '#52525b';
          ctx.font = 'bold 28px "Noto Sans JP", sans-serif';
          cursorY = wrapCanvasText(
            ctx,
            formatPairCast(top1.castList) + ' / ' + top1.year,
            124,
            cursorY + 6,
            832,
            40
          );

          ctx.fillStyle = '#3f3f46';
          ctx.font = '25px "Noto Sans JP", sans-serif';
          cursorY = wrapCanvasText(ctx, top1.synopsis, 124, cursorY + 14, 832, 38);

          cursorY += 24;
          ctx.fillStyle = '#71717a';
          ctx.font = 'bold 24px "Noto Sans JP", sans-serif';
          ctx.fillText('2位〜4位', 124, cursorY);
          cursorY += 42;

          for (let i = 1; i <= 3 && i < ranked.length; i++) {
            const item = ranked[i].drama;
            ctx.fillStyle = '#18181b';
            ctx.font = 'bold 26px "Noto Sans JP", sans-serif';
            cursorY = wrapCanvasText(
              ctx,
              (i + 1) + '位：' + item.title + '（' + formatPairCast(item.castList) + '）',
              124,
              cursorY,
              832,
              36
            );
            cursorY += 10;
          }

          const dataUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = 'bl-oshi-diagnosis.png';
          link.href = dataUrl;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('PNG画像を保存しました');
        } catch (e) {
          showToast('画像保存に失敗しました');
        }
      }

      function handleGroupNameInput(val) {

      function selectQuizOption(qIdx, optIdx) {

      }

      function nextQuizStep() {
        if (state.quizStep < QUIZ_QUESTIONS.length) {
          state.quizStep += 1;
          render();
        }
      }

      function restartQuiz() {
        state.answers = new Array(QUIZ_QUESTIONS.length).fill(null);
        state.quizStep = 0;
        render();
      }

        const answeredCount = state.answers.filter(function (a) { return a !== null; }).length;

        const groupInputHtml = `

                <button

                    return renderDramaCard(entry.drama, { rank: idx + 2 });

        }

        const stepIdx = Math.min(state.quizStep, QUIZ_QUESTIONS.length - 1);
        const q = QUIZ_QUESTIONS[stepIdx];
        const selectedOpt = state.answers[stepIdx];
        const progressPct = Math.round(((stepIdx + 1) / QUIZ_QUESTIONS.length) * 100);

        return `

              ${escapeHtml(q.question)}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
              ${q.options.map(function (opt, optIdx) {
                const isSelected = selectedOpt === optIdx;
                return `

              >
                前へ
              </button>

              <div class="flex items-center gap-2">
                ${answeredCount === QUIZ_QUESTIONS.length ? `
                  <button
                    type="button"
                    onclick="state.quizStep = QUIZ_QUESTIONS.length; render();"
                    class="px-4 py-2.5 rounded-2xl primary-gradient text-white text-xs sm:text-sm font-bold transition cursor-pointer"
                  >
                    結果を見る

                <button

      // =========================================================================

      // =========================================================================
      function getCatalogTags() {
        const preferred = [
          'すべて',
          '学園・青春',
          '大人・オフィス',
          '同居・ルームシェア',
          '甘々・胸キュン',
          '切なさ・エモ',
          'コメディ・笑える',
          'グループ・仲間',
          '深夜枠',
          '配信限定'
        ];
        const set = new Set();
        BL_DRAMAS.forEach(function (d) {
          (d.tags || []).forEach(function (t) { set.add(t); });
        });
        const list = preferred.filter(function (t) {
          return t === 'すべて' || set.has(t);
        });
        set.forEach(function (t) {
          if (list.indexOf(t) === -1) list.push(t);
        });
        return list;
      }

      function getFilteredDramas() {
        const q = state.catalogSearch.trim().toLowerCase();
        const filtered = BL_DRAMAS.filter(function (d) {
          if (state.catalogTag !== 'すべて') {
            if (!Array.isArray(d.tags) || d.tags.indexOf(state.catalogTag) === -1) {
              return false;
            }
          }
          if (!q) return true;
          const formattedCast = formatPairCast(d.castList);
          const rawCast = (d.castList || []).join(' ');
          const groupsStr = getDramaGroupsLabel(d.castList);
          const hay = [
            d.title,
            formattedCast,
            rawCast,
            groupsStr,
            d.year,
            (d.tags || []).join(' '),
            (d.platforms || []).join(' '),
            d.synopsis
          ].join(' ').toLowerCase();
          return hay.indexOf(q) !== -1;
        });

        return filtered.sort(function (a, b) {
          if (state.catalogSort === 'title') {
            return String(a.title).localeCompare(String(b.title), 'ja');
          }
          if (state.catalogSort === 'year') {
            const ya = typeof a.sortYear === 'number' ? a.sortYear : 0;
            const yb = typeof b.sortYear === 'number' ? b.sortYear : 0;
            if (yb !== ya) return yb - ya;
            return (b.popularScore || 0) - (a.popularScore || 0);
          }
          return (b.popularScore || 0) - (a.popularScore || 0);
        });
      }

      function handleCatalogSearch(val) {
        state.catalogSearch = val;
        render();
      }

      function handleCatalogTag(tag) {
        state.catalogTag = tag;
        render();
      }

      function handleCatalogSort(sortVal) {
        state.catalogSort = sortVal;
        render();

      function renderCatalogView() {

        const list = getFilteredDramas();

        return `

            c.actorName,
            formattedActor,
            c.dramaTitle,
            c.roleType,
            c.description

          return hay.indexOf(q) !== -1;

        const actorDisplay = formatActorName(person.actorName);

        return `
          <article class="rounded-2xl border border-zinc-200/90 bg-white p-4 sm:p-5 flex flex-col justify-between gap-3">
            <div class="space-y-2">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <button
                    type="button"
                    onclick="jumpToDrama('${escapeJsAttr(person.dramaTitle)}')"
                    class="text-xs font-bold text-purple-700 hover:underline text-left cursor-pointer"
                  >
                    ${escapeHtml(person.dramaTitle)}
                  </button>
                  <h4 class="text-base sm:text-lg font-extrabold text-zinc-900 mt-0.5 leading-snug">
                    ${escapeHtml(person.characterName)}
                  </h4>
                </div>

                <button
                  type="button"
                  aria-label="★推しリスト切り替え"
                  onclick="toggleFavorite('${escapeJsAttr(person.id)}')"
                  class="w-9 h-9 rounded-xl flex items-center justify-center text-base font-bold transition cursor-pointer shrink-0 ${
                    fav
                      ? 'bg-pink-100 text-pink-600'
                      : 'bg-zinc-100 text-zinc-400 hover:text-zinc-700'
                  }"
                >
                  ★
                </button>
              </div>

              <p class="text-xs sm:text-sm font-bold text-zinc-800 leading-relaxed">
                ${escapeHtml(actorDisplay)}
              </p>

              <p class="text-xs sm:text-sm text-zinc-600 leading-relaxed">
                ${escapeHtml(person.description)}
              </p>
            </div>

            <div class="pt-2 border-t border-zinc-100">
              <span class="px-2.5 py-0.5 rounded-full bg-zinc-100 text-zinc-700 text-xs font-semibold">
                ${escapeHtml(person.roleType)}
              </span>
            </div>
          </article>
        `;
      }

      // =========================================================================
      // 14. メイン描画・エスケープ・初期化
      // =========================================================================
      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeJsAttr(str) {
        return String(str || '')
          .replace(/\\/g, '\\\\')
          .replace(/'/g, "\\'");
      }

      function render() {
        try {
          updateHeader();
          const mainEl = document.getElementById('main-view');
          if (!mainEl) return;

          if (state.activeTab === 'catalog') {
            mainEl.innerHTML = renderCatalogView();
          } else if (state.activeTab === 'supporting') {
            mainEl.innerHTML = renderSupportingView();
          } else if (state.activeTab === 'favorites') {
            mainEl.innerHTML = renderFavoritesView();
          } else {
            mainEl.innerHTML = renderQuizView();
          }
        } catch (err) {
          const mainEl = document.getElementById('main-view');
          if (mainEl) {
            mainEl.innerHTML = '<div class="glass-card rounded-3xl p-6 text-sm text-zinc-700">表示の更新中に問題が発生しました。</div>';
          }
        }
      }

      function restoreFromQueryParams() {
        try {
          const params = new URLSearchParams(window.location.search);
          const groupParam = params.get('group');
          if (groupParam) {
            state.groupName = groupParam;
            saveGroupName(groupParam);
          }
          const qParam = params.get('q');
          if (qParam) {
            const parts = qParam.split(',');
            if (parts.length === QUIZ_QUESTIONS.length) {
              let complete = true;
              const parsed = parts.map(function (p) {
                if (p === '-' || p === '') {
                  complete = false;
                  return null;
                }
                const num = Number(p);
                if (!Number.isInteger(num) || num < 0 || num > 3) {
                  complete = false;
                  return null;
                }
                return num;
              });
              state.answers = parsed;
              if (complete) {
                state.activeTab = 'quiz';
                state.quizStep = QUIZ_QUESTIONS.length;
              }
            }
          }
        } catch (e) {
          // Ignore invalid URL query params
        }
      }

      window.switchTab = switchTab;
      window.handleGroupNameInput = handleGroupNameInput;
      window.selectQuizOption = selectQuizOption;
      window.prevQuizStep = prevQuizStep;
      window.nextQuizStep = nextQuizStep;
      window.restartQuiz = restartQuiz;
      window.handleCatalogSearch = handleCatalogSearch;
      window.handleCatalogTag = handleCatalogTag;
      window.handleCatalogSort = handleCatalogSort;
      window.handleSupportingSearch = handleSupportingSearch;
      window.handleSupportingRole = handleSupportingRole;
      window.toggleFavorite = toggleFavorite;
      window.clearFavorites = clearFavorites;
      window.jumpToDrama = jumpToDrama;
      window.copyShareUrl = copyShareUrl;
      window.shareToX = shareToX;
      window.shareAppUrl = shareAppUrl;
      window.downloadResultPng = downloadResultPng;
      window.calculateDiagnosis = calculateDiagnosis;

      function initApp() {
        restoreFromQueryParams();
        render();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
